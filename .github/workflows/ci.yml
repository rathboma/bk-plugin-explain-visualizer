name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests, the SQLite integration tests (node:sqlite) and the PostgreSQL
  # integration tests against each supported major version.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgres://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

  # The MySQL engine against each server family: the old JSON-only MySQL,
  # the tree format with EXPLAIN ANALYZE, MySQL 9's JSON, and MariaDB's.
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:5.7", "mysql:8.0", "mysql:8.4", "mysql:9", "mariadb:10.6", "mariadb:11.4"]
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: pw
          MYSQL_DATABASE: shop
          MARIADB_ROOT_PASSWORD: pw
          MARIADB_DATABASE: shop
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppw || mariadb-admin ping -h 127.0.0.1 -uroot -ppw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      MYSQL_URL: mysql://root:pw@127.0.0.1:3306/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn vitest run tests/integration/mysql.spec.ts
