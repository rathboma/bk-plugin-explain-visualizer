<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explain Visualizer harness</title>
    <style>
      body {
        margin: 0;
        font: 13px system-ui, sans-serif;
        background: #222;
        color: #ddd;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #111;
        border-bottom: 1px solid #333;
      }
      header label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      header select,
      header button {
        font: inherit;
      }
      #tab-title {
        margin-left: auto;
        padding: 3px 10px;
        border-radius: 4px 4px 0 0;
        background: #181818;
        color: #fff;
      }
      #frame-wrap {
        flex: 1;
        min-height: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #log {
        max-height: 90px;
        overflow: auto;
        margin: 0;
        padding: 4px 12px;
        font: 11px ui-monospace, monospace;
        background: #111;
        color: #8a8;
        border-top: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Harness</strong>
      <label
        >Opened from
        <select id="scenario"></select>
      </label>
      <label
        >Database
        <select id="database">
          <option value="postgresql">postgresql</option>
          <option value="mysql">mysql (unsupported)</option>
        </select>
      </label>
      <label
        >Theme
        <select id="theme">
          <option value="dark">dark</option>
          <option value="light">light</option>
        </select>
      </label>
      <label><input id="readonly" type="checkbox" /> read-only</label>
      <label><input id="keep-state" type="checkbox" /> keep tab state</label>
      <button id="reload">Reload tab</button>
      <span id="tab-title">Explain Visualizer</span>
    </header>
    <div id="frame-wrap"><iframe id="plugin" title="plugin"></iframe></div>
    <pre id="log"></pre>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
